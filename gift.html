<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية عيد الحب</title>

<style>
body{
font-family:Tajawal,sans-serif;
background:linear-gradient(135deg,#ffe0f0,#ffddee);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
text-align:center;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
max-width:400px;
}

button{
background:linear-gradient(90deg,#ff6b81,#7b5cff);
color:#fff;
padding:12px 24px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

h1,p,audio{opacity:0;transition:1s}

.feedback{
display:none;
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:#ffffffdd;
padding:10px 18px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
font-size:14px;
}

.feedback a{
margin:5px;
display:inline-block;
padding:6px 12px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

.wa{background:#25D366;}
.tg{background:#0088cc;}
.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
</style>
</head>

<body>

<div class="card">
<h1 id="to">💌 لديك مفاجأة</h1>
<p id="msg">اضغط الزر لفتحها</p>
<button id="btn">اضغط هنا</button>

<audio id="audio" controls style="margin-top:20px;width:100%">
<source id="source" src="" type="audio/mp4">
</audio>
</div>

<div class="feedback" id="feedback">
💬 رأيك يهمني
<br>
<a class="wa" target="_blank" href="https://wa.me/967733666751?text=شفت%20هدية%20عيد%20الحب%20وكانت%20جميلة%20❤️">واتساب</a>
<a class="tg" target="_blank" href="https://t.me/BN_MUTHANNA_3">تلجرام</a>
<a class="ig" target="_blank" href="https://www.instagram.com/bn_muthanna_1">انستقرام</a>
</div>

<script>
const params=new URLSearchParams(location.search);
const to=params.get("to")||"أنت";
const msg=params.get("msg")||"أحبك ❤️";
const song=params.get("song")||"1";

const songs={
1:"https://files.catbox.moe/95bzmk.m4a",
2:"https://files.catbox.moe/82q2es.m4a"
};

document.getElementById("source").src=songs[song];
document.getElementById("audio").load();

document.getElementById("btn").onclick=()=>{
document.getElementById("to").textContent="إلى "+to;
document.getElementById("msg").textContent=msg;

document.getElementById("to").style.opacity=1;
document.getElementById("msg").style.opacity=1;
document.getElementById("audio").style.opacity=1;

document.getElementById("audio").play();
document.getElementById("btn").style.display="none";

document.getElementById("feedback").style.display="block";
};
</script>

</body>
</html>
