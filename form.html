<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أرسل تهنئتك</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #fff0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input, select, textarea, button {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎁 أرسل تهنئة عيد الحب</h2>
    <input type="text" id="to" placeholder="اسم المرسل إليه">
    <select id="messageChoice">
      <option value="">✏️ أريد كتابة رسالتي الخاصة</option>
      <option value="أنت قلبي وحياتي. أحبك للأبد ❤️">أنت قلبي وحياتي. أحبك للأبد ❤️</option>
      <option value="كل لحظة معك هي هدية. 💝">كل لحظة معك هي هدية. 💝</option>
      <option value="أنت نبضي، وأجمل ما في أيامي. 🌹">أنت نبضي، وأجمل ما في أيامي. 🌹</option>
      <option value="وجودك يكفي لأسعد قلبي. 💘">وجودك يكفي لأسعد قلبي. 💘</option>
      <option value="كل عام وأنت الحب. 💌">كل عام وأنت الحب. 💌</option>
    </select>
    <textarea id="customMessage" placeholder="اكتب رسالتك هنا إذا أردت..."></textarea>
    <label>اختر الأغنية</label>
    <select id="song">
      <option value="1">أغنية رومانسية 1</option>
      <option value="2">أغنية رومانسية 2</option>
    </select>
    <button onclick="generateLink()">🎉 أنشئ الرابط</button>
    <p id="result"></p>
  </div>
  <script>
    const messageChoice = document.getElementById('messageChoice');
    const customMessage = document.getElementById('customMessage');
    messageChoice.addEventListener('change', () => {
      if (messageChoice.value) customMessage.value = '';
    });
    customMessage.addEventListener('input', () => {
      if (customMessage.value) messageChoice.value = '';
    });
    function generateLink() {
      const to = document.getElementById('to').value.trim();
      const msg = customMessage.value.trim() || messageChoice.value;
      const song = document.getElementById('song').value;
      if (!to || !msg) {
        alert('يرجى إدخال الاسم واختيار أو كتابة رسالة.');
        return;
      }
      const link = `gift.html?to=${encodeURIComponent(to)}&msg=${encodeURIComponent(msg)}&song=${song}`;
      document.getElementById('result').innerHTML = `📎 رابطك: <a href="${link}" target="_blank">${link}</a>`;
    }
  </script>
</body>
</html>
