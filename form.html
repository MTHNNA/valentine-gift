<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال هدية عيد الحب</title>

<style>
body{
font-family:Tajawal, sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffeef5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
text-align:center;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
margin-top:15px;
padding:12px;
width:100%;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff6b81,#7b5cff);
color:white;
font-size:16px;
cursor:pointer;
}

#result{
margin-top:15px;
word-break:break-all;
background:#f3f3f3;
padding:10px;
border-radius:10px;
}

/* feedback */
.feedback{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:#ffffffdd;
padding:10px 18px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
font-size:14px;
text-align:center;
}

.feedback a{
margin:5px;
display:inline-block;
padding:6px 12px;
border-radius:10px;
color:white;
text-decoration:none;
font-weight:bold;
}

.wa{background:#25D366;}
.tg{background:#0088cc;}
.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
</style>
</head>

<body>

<div class="card">
<h2>🎁 اصنع هدية</h2>

<input id="name" placeholder="اسم الشخص">

<select id="preset" onchange="toggleCustom()">
<option value="">اختر رسالة جاهزة</option>

<option value="كل سنة وأنت أجمل أقداري ❤️">كل سنة وأنت أجمل أقداري ❤️</option>
<option value="وجودك أجمل هدية في حياتي 💕">وجودك أجمل هدية في حياتي 💕</option>
<option value="أحبك أكثر من أمس وأقل من غدًا 💘">أحبك أكثر من أمس وأقل من غدًا 💘</option>
<option value="أنت سعادتي الدائمة 💞">أنت سعادتي الدائمة 💞</option>
<option value="قلبي اختارك للأبد 💓">قلبي اختارك للأبد 💓</option>

<option value="custom">✍️ اكتب رسالتك</option>
</select>

<textarea id="custom" placeholder="اكتب رسالتك هنا..." style="display:none"></textarea>

<select id="song">
<option value="1">الأغنية الأولى</option>
<option value="2">الأغنية الثانية</option>
</select>

<button onclick="create()">إنشاء الرابط</button>

<div id="result"></div>
</div>

<div class="feedback">
💬 أعجبك الموقع؟
<br>
<a class="wa" target="_blank" href="https://wa.me/967733666751?text=شفت%20موقعك%20وكان%20جميل%20❤️">واتساب</a>
<a class="tg" target="_blank" href="https://t.me/BN_MUTHANNA_3">تلجرام</a>
<a class="ig" target="_blank" href="https://www.instagram.com/bn_muthanna_1">انستقرام</a>
</div>

<script>
function toggleCustom(){
let preset=document.getElementById("preset").value;
let custom=document.getElementById("custom");
custom.style.display = preset==="custom" ? "block":"none";
}

function create(){
let name=document.getElementById("name").value || "أنت";
let preset=document.getElementById("preset").value;
let custom=document.getElementById("custom").value;

let msg = preset==="custom" ? (custom||"❤️") : (preset||custom||"❤️");
let song=document.getElementById("song").value;

let link=`${location.origin}/gift.html?to=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}&song=${song}`;


document.getElementById("result").innerHTML=`انسخ الرابط وارسله:<br><a href="${link}" target="_blank">${link}</a>`;
}
</script>

</body>
</html>
